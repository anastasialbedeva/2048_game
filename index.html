<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1 class="title">2048</h1>
      <div class="score">
        <span class="score-label">Счёт</span>
        <span class="score-value" id="score">0</span>
      </div>
    </header>

    <div class="buttons">
      <button class="button" id="undo-button">Отменить ход</button>
      <button class="button" id="restart-button">Новая игра</button>
      <button class="button" id="leaders-button">Рекорды</button>
    </div>

    <div class="board" id="board">
      <div class="grid" id="grid"></div>
      <div class="tiles" id="tiles"></div>

      <div class="game-over hidden" id="game-over">
        <p class="game-over-message" id="game-over-message">Игра окончена!</p>
        <input class="name-input" id="name-input" type="text" placeholder="Ваше имя" maxlength="20">
        <button class="button" id="save-button">Сохранить результат</button>
        <button class="button" id="new-game-button">Начать заново</button>
      </div>
    </div>

    <p class="hint">Управление: стрелки на клавиатуре</p>
  </main>

  <div class="modal hidden" id="leaders-modal">
    <div class="modal-content">
      <h2 class="modal-title">Таблица лидеров</h2>
      <table class="leaders-table">
        <thead>
          <tr>
            <th>№</th>
            <th>Имя</th>
            <th>Очки</th>
            <th>Дата</th>
          </tr>
        </thead>
        <tbody id="leaders-body"></tbody>
      </table>
      <button class="button" id="close-leaders-button">Закрыть</button>
    </div>
  </div>

</body>
</html>
